# Publishes a self-contained linux-x64 build and attaches it as
# homeca-linux-x64.tar.gz to the GitHub Release.
#
# Trigger: push a tag like v0.1.0, v1.2.3, etc.
#   git tag v0.1.0
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building version ${TAG}"

      - name: Publish linux-x64
        run: |
          dotnet publish src/HomeCA.Service/HomeCA.Service.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:Version=${{ steps.version.outputs.version }} \
            --output ./publish

      - name: Package tarball
        run: |
          tar -czf homeca-linux-x64.tar.gz -C ./publish .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: homeca-linux-x64.tar.gz
